/* ===========================================================
   PRELOAD — design tokens
   Palette grounded in a Miami/Vice night: deep indigo sky,
   sunset gold, and the pink/teal duotone of the coastline at dusk.
   =========================================================== */

@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap');

:root {
  --bg: #0E1225;
  --bg-panel: #171B32;
  --bg-panel-alt: #1D2242;
  --text: #F5F3ED;
  --text-muted: #9AA0B4;
  --pink: #FF3E7F;
  --teal: #2DE2C5;
  --gold: #FFB238;
  --border: rgba(245, 243, 237, 0.09);
  --border-strong: rgba(245, 243, 237, 0.16);
  --radius: 14px;
  --max: 1120px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255, 62, 127, 0.16), transparent 60%),
    radial-gradient(ellipse 800px 500px at 100% 0%, rgba(45, 226, 197, 0.12), transparent 55%);
  color: var(--text);
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, .display {
  font-family: 'Unbounded', 'Manrope', sans-serif;
  line-height: 1.12;
  margin: 0;
  letter-spacing: -0.01em;
}

h1 { font-weight: 700; }
h2 { font-weight: 600; }
h3 { font-weight: 600; }

a { color: inherit; }

p { color: var(--text-muted); max-width: 62ch; }

.wrap {
  max-width: var(--max);
  margin: 0 auto;
  padding: 0 24px;
}

/* -------- header -------- */
header.site {
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(14, 18, 37, 0.85);
  backdrop-filter: blur(10px);
  z-index: 10;
}

header.site .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
}

.logo {
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 1.15rem;
  text-decoration: none;
  color: var(--text);
  display: flex;
  align-items: baseline;
  gap: 6px;
